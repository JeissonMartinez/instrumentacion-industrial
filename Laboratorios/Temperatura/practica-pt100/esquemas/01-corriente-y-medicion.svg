<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140"><style>text{font-family:Arial,sans-serif;fill:#173047} .wire{fill:none;stroke:#173047;stroke-width:3;stroke-linejoin:round} .box{fill:#f1f6fb;stroke:#50718c;stroke-width:2} .label{font-size:18px} .small{font-size:16px} .title{font-size:25px;font-weight:bold}</style><rect width="1200" height="1140" fill="white"/><text x="40" y="40" class="title">1. Calibración de la entrada con corriente medida</text><text x="40" y="72" class="small">Transmisor desconectado. Multímetro en mA CC y conectado en serie.</text><circle cx="100" cy="228" r="38" fill="white" stroke="#173047" stroke-width="3"/><text x="91" y="216" class="label">+</text><text x="92" y="252" class="label">−</text><text x="35" y="298" class="small">Fuente 24 V</text><polyline class="wire" points="100,190 200,190"/><polyline class="wire" points="200,190 215,190"/><rect x="215" y="178" width="65" height="24" fill="white" stroke="#173047" stroke-width="3"/><polyline class="wire" points="280,190 295,190"/><text x="195" y="160" class="small">R fija: 910 Ω / 1 W</text><polyline class="wire" points="295,190 380,190"/><polyline class="wire" points="380,190 395,190"/><rect x="395" y="178" width="65" height="24" fill="white" stroke="#173047" stroke-width="3"/><polyline class="wire" points="460,190 475,190"/><text x="375" y="160" class="small">Reóstato: 10 kΩ / 25 W</text><polyline class="wire" points="475,190 550,190 550,245 445,245 445,202"/><polyline class="wire" points="445,202 438,214 452,212 445,202"/><text x="370" y="275" class="small">RHS10KE: cursor unido a un extremo</text><polyline class="wire" points="550,190 630,190"/><circle cx="675" cy="190" r="45" fill="white" stroke="#173047" stroke-width="3"/><text x="657" y="196" class="label">mA</text><text x="615" y="135" class="small">mA / rojo     COM / negro</text><polyline class="wire" points="720,190 830,190"/><rect class="box" x="830" y="130" width="320" height="260" rx="8"/><text x="850" y="160" class="label">DNMEB50</text><text x="845" y="196" class="label">II1</text><polyline class="wire" points="830,190 925,190 925,225"/><rect x="913" y="225" width="24" height="65" fill="white" stroke="#173047" stroke-width="3"/><text x="955" y="262" class="small">240 Ω internos</text><polyline class="wire" points="925,290 925,340 830,340"/><text x="845" y="368" class="label">GND</text><polyline class="wire" points="925,190 1020,190"/><text x="965" y="215" class="small">→ seguidor → A0</text><text x="850" y="415" class="small">Alimentar también sus bornes VIN / GND a 24 V.</text><polyline class="wire" points="830,340 100,340 100,266"/><text x="250" y="330" class="small">Retorno común al negativo de la fuente</text><text x="40" y="465" class="small">Ajuste: empezar con el potenciómetro a máxima resistencia; reducir observando el multímetro.</text><text x="40" y="493" class="small">Registrar ADC a 4,00 mA y a 20,00 mA. No superar 20 mA durante el ajuste.</text><text x="40" y="521" class="small">910 Ω permiten alcanzar 20 mA; NO limitan por sí solos la corriente a 20 mA (máximo nominal ≈ 20,9 mA).</text><text x="40" y="549" class="small">Reóstato bobinado lineal, montaje en panel. Montar sin tensión; multímetro en mA siempre en serie.</text><text x="40" y="610" class="title">2. Medición de temperatura después de calibrar</text><text x="40" y="642" class="small">Transmisor PT100 de dos hilos, configurado a 0–50 °C → 4–20 mA.</text><circle cx="100" cy="788" r="38" fill="white" stroke="#173047" stroke-width="3"/><text x="91" y="776" class="label">+</text><text x="92" y="812" class="label">−</text><text x="35" y="858" class="small">Fuente 24 V</text><polyline class="wire" points="100,750 360,750"/><rect class="box" x="360" y="705" width="300" height="110" rx="8"/><text x="380" y="734" class="label">TRANSMISOR PT100</text><text x="375" y="774" class="label">+</text><text x="630" y="774" class="label">−</text><text x="420" y="798" class="small">Salida 4–20 mA</text><polyline class="wire" points="660,750 830,750"/><rect class="box" x="830" y="690" width="320" height="260" rx="8"/><text x="850" y="720" class="label">DNMEB50</text><text x="845" y="756" class="label">II1</text><polyline class="wire" points="830,750 925,750 925,785"/><rect x="913" y="785" width="24" height="65" fill="white" stroke="#173047" stroke-width="3"/><text x="955" y="822" class="small">240 Ω internos</text><polyline class="wire" points="925,850 925,900 830,900"/><text x="845" y="928" class="label">GND</text><polyline class="wire" points="925,750 1020,750"/><text x="965" y="775" class="small">→ seguidor → A0</text><text x="850" y="975" class="small">Alimentar también sus bornes VIN / GND a 24 V.</text><polyline class="wire" points="830,900 100,900 100,826"/><rect class="box" x="400" y="845" width="210" height="50" rx="8"/><text x="445" y="876" class="label">Sonda PT100</text><polyline class="wire" points="460,815 460,845"/><polyline class="wire" points="490,815 490,845"/><polyline class="wire" points="520,815 520,845"/><text x="320" y="928" class="small">Conectar 2 o 3 hilos según el manual del transmisor.</text><text x="40" y="1035" class="small">A0 mide respecto a GND: 4 mA → 0,96 V; 20 mA → 4,80 V (valores nominales).</text><text x="40" y="1065" class="small">T = (ADC − ADC₄) × 50 / (ADC₂₀ − ADC₄). Usar los ADC medidos y el rango real del transmisor.</text><text x="40" y="1095" class="small">En medición se retiran la resistencia externa, el potenciómetro y el multímetro de la prueba.</text></svg>