<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><style>text{font-family:Arial;fill:#173047;font-size:19px} .w{fill:none;stroke:#173047;stroke-width:3} .b{fill:#edf5fc;stroke:#173047;stroke-width:2}</style><rect width="1100" height="720" fill="white"/><text x="35" y="42" style="font-size:26px">PT100: verificación del transmisor para un rango de 0 a 50 °C</text><text x="35" y="78">Circuito de prueba: sustituir la sonda por una resistencia de precisión.</text><rect class="b" x="350" y="180" width="300" height="240" rx="10"/><text x="390" y="220">Transmisor TT / PT100</text><text x="370" y="260">A</text><text x="480" y="260">B</text><text x="590" y="260">b</text><path class="w" d="M380 240 V120 H430 M540 120 H600 V240 M490 240 V120"/><rect class="b" x="430" y="108" width="110" height="24"/><text x="370" y="100">R de simulación PT100</text><circle cx="490" cy="120" r="5" fill="#173047"/><text x="380" y="390">+</text><text x="590" y="390">−</text><path class="w" d="M380 400 V480 H90 V200 M600 400 V480 H720 M810 480 H900 V370 M900 540 H90 V250"/><rect class="b" x="35" y="150" width="110" height="100"/><text x="50" y="185">24 V CC</text><text x="70" y="215">+</text><text x="70" y="242">−</text><circle class="b" cx="765" cy="480" r="45"/><text x="747" y="486">mA</text><text x="690" y="420">mA → COM</text><rect class="b" x="850" y="290" width="210" height="270"/><text x="870" y="325">DNMEB50</text><text x="870" y="365">II1 → A0*</text><path class="w" d="M900 370 V400 M900 460 V540"/><rect class="b" x="888" y="400" width="24" height="60"/><text x="930" y="434">240 Ω</text><text x="930" y="460">internos</text><text x="915" y="535">GND</text><text x="35" y="600">0 °C → 100,0000 Ω; 25 °C → 109,7347 Ω; 50 °C → 119,3971 Ω.</text><text x="35" y="630">B y b: dos cables separados unidos al mismo extremo de R. A: al otro extremo.</text><text x="35" y="660">Alimentar también VIN/GND de la tarjeta a 24 V. Cambiar resistencias sin tensión.</text><text x="35" y="690">* A0 recibe el voltaje de entrada mediante el seguidor interno. Amperímetro siempre en serie.</text></svg>